apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId "pe.com.dms.inventariosoft"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 7
        versionName "1.0.9"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField "String", "DB_NAME", "\"inventariosoft.db\""
        buildConfigField "String", "PREF_NAME", "\"inventariosoft\""
        buildConfigField "String", "BASE_URL_IP", "\"https://172.98.41.23/\""

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('keystore/dms-debug.jks')
            keyAlias 'DMSPeru'
            storePassword 'DMSPeru'
            keyPassword 'DMSPeru'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        } /*   -optimize  se agrego */
        debug {
            resValue("string", "PORT_NUMBER", "8081")
        }
    }
// kotlin
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def projectName = "TomaInv"
            def date = new Date().format('ddMMyyyy', TimeZone.getTimeZone("GMT-5"))
            def time = new Date().format('HHmmss', TimeZone.getTimeZone("GMT-5"))
            def apkName = "${projectName}-${variant.versionName}-${variant.versionCode}-${time}-${date}-${variant.buildType.name}.apk"
            def outputDir = new File("${rootProject.rootDir}/app/build/outputs/apk/${variant.flavorName}/${variant.buildType.name}")
//            variant.packageApplicationProvider.get().outputDirectory = new File("$outputDir")
            output.outputFileName = apkName
        }
    }

    buildFeatures {
        viewBinding true
    }
}

//implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs\\USDKLibrary-v1.2.0620.aar')

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    testImplementation "junit:junit:$rootProject.junitVersion"
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    //    Analytics
    implementation 'com.google.firebase:firebase-core:19.0.0'
    //    Room - Local Database
    implementation 'androidx.room:room-runtime:2.3.0'
    kapt 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-rxjava2:2.3.0'
    //    ButterKnife - View Injection
    implementation "com.jakewharton:butterknife:$rootProject.butterKnifeVersion"
    kapt "com.jakewharton:butterknife-compiler:$rootProject.butterKnifeVersion"
    //    Retrofit - Networking
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:3.6.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.6.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.3.0'
    //    Glide - Image Handling
    implementation "com.github.bumptech.glide:glide:$rootProject.glideVersion"
    kapt "com.github.bumptech.glide:compiler:$rootProject.glideVersion"
    //    RxJava - RxAndroid
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    //    Log
    implementation 'com.jakewharton.timber:timber:5.0.1'
    //    Dagger - Dependency Injection
    implementation "com.google.dagger:dagger:$rootProject.daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$rootProject.daggerVersion"
    //    provided 'org.glassfish:javax.annotation:10.0-b28' //Required by Dagger2
    //    Espresso - Testing
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    //    Charts
    //implementation 'com.github.PhilJay:MPAndroidChart:v3.0.2'
    //      https://github.com/thoughtbot/expandable-recycler-view
//    implementation 'com.thoughtbot:expandablerecyclerview:1.3'
    // https://github.com/daimajia/AndroidSwipeLayout
    implementation "com.daimajia.swipelayout:library:1.2.0@aar"
    //    QR Lib
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    //Depuración
   // debugImplementation 'com.amitshekhar.android:debug-db:1.0.6'
    //firebase crashlitys
    implementation platform('com.google.firebase:firebase-bom:26.1.0')
    implementation 'com.google.firebase:firebase-crashlytics:18.1.0'
    implementation 'com.google.firebase:firebase-analytics:19.0.0'
    //multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    //permission
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'

    //RemoteConfig
    implementation 'com.google.firebase:firebase-config'

    //CameraX
    def camerax_version = "1.2.0"
    implementation("androidx.camera:camera-core:${camerax_version}")
    implementation("androidx.camera:camera-camera2:${camerax_version}")
    implementation("androidx.camera:camera-lifecycle:${camerax_version}")
    implementation("androidx.camera:camera-view:${camerax_version}")


     //   implementation 'com.google.dagger:dagger:2.x.x'
     //   annotationProcessor 'com.google.dagger:dagger-compiler:2.x.x'

}